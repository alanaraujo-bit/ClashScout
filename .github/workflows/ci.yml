name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test e build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Os pacotes compartilhados precisam existir em dist/ antes de tipar,
      # lintar ou testar os apps. `build:database` tambem roda `prisma generate`,
      # sem o qual os tipos do client nao existem.
      - name: Build dos pacotes compartilhados
        run: npm run build:shared && npm run build:database

      - name: Formatação
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm run test

      - name: Build
        run: npm run build
